<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page - South Rafting Company</title>
    <meta name="description" content="South Rafting Company Home Page">
    <meta name="author" content="Francisco Blanco">
    <link rel="stylesheet" href="styles/rafting.css">
</head>


<body>
    <header>
        <img src="images/wwr-logo.jpg" alt="White Water Rafting Logo" width="200">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <h1>Welcome to our Home Page</h1>
            <img src="images/rafting-hero.jpg" alt="Hero-image">
        </div>
        <section>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Adress:</label>
                <input type="email" id="email" name="email" required>

                <label><input type="checkbox" id="newsletter" name="newsletter"> Please
                    subscribe me
                    to the newsletter</label>

                <button type="submit">Send my information</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy;2026 🏞️ South Rafting Company 🏞️ Francisco Blanco</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="Youtube Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
