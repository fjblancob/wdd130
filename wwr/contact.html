<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - South Rafting Company</title>
    <meta name="description"
      content="White Water Rafting Contact Page. Here you can find information about our company and how to contact us.">
    <meta name="author" content="Francisco Blanco">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.jpg" alt="White Water Rafting Logo" width="200">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/rafting.jpg" alt="Rafting Company">
            <h1>South Rafting Company</h1>
        </div>
        <section>
            <h2>South Rafting Company Contact</h2>
            <p>You can find us in: 451 Rio Manso Way.</p>
            <p>Call us at: +1 128 519 637.</p>
            <p>Our email is: info@southrafting.com.</p>
            <div>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2121.211505646324!2d-71.71365075197511!3d-41.246910595502634!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x961a11007181aa09%3A0x9944bb2580b7eca3!2sR%C3%ADo%20Manso!5e0!3m2!1ses!2sar!4v1792029126758!5m2!1ses!2sar"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email Adress:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="3"></textarea>

                <label><input type="checkbox" id="newsletter" name="newsletter"> Please subscribe me
                    to the monthly newsletter</label>

                <button type=" submit">Submit</button>
            </form>
        </section>
        <form> </form>
        <section>
            <h2>Adventure Awaits You!</h2>
            <figure>
                <img src=" images/adventure1.jpg" alt="Full Day Adventure">
                <figcaption>Full Day Adventure</figcaption>
            </figure>
            <figure>
                <img src="images/adventure2.jpg" alt="Grand Canyon Style">
                <figcaption>Grand Canyon Style</figcaption>
            </figure>
            <figure>
                <img src="images/adventure3.jpg" alt="Ultimate Adventure">
                <figcaption>Ultimate Adventure</figcaption>
            </figure>
            <figure>
                <img src="images/adventure4.jpg" alt="Half Day Adventure">
                <figcaption>Half Day Adventure</figcaption>
            </figure>
            <figure>
                <img src="images/adventure5.jpg" alt="Big Mallard Adventure">
                <figcaption>Big Mallard Adventure</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy;2026 🏞️ South Rafting Company 🏞️ Francisco Blanco</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">

            <a href="https://youtube.com">

            </a>
        </nav>
    </footer>

</html>
